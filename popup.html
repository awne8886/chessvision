<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 270px; padding: 12px; }
    h3 { margin: 0 0 10px; }
    .row { margin: 12px 0; }
    label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    input[type=range] { width: 100%; }
    .switch { display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
    .switch input { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <h3>ChessVision</h3>
  <div class="row switch">
    <span>Auto-play</span>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label>Search depth <b id="depthVal"></b></label>
    <input type="range" id="depth" min="1" max="20" step="1">
  </div>
  <div class="row">
    <label>Min delay <b id="minVal"></b></label>
    <input type="range" id="minDelay" min="100" max="3000" step="50">
  </div>
  <div class="row">
    <label>Max delay <b id="maxVal"></b></label>
    <input type="range" id="maxDelay" min="100" max="3000" step="50">
  </div>
  <script src="popup.js"></script>
</body>
</html>
